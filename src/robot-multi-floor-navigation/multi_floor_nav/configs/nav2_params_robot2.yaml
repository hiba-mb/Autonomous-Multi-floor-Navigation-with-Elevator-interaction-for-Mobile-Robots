robot2/amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.5
    alpha2: 0.5
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1
    base_frame_id: "robot2/base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "robot2/map"
    global_localization: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 30.0
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"
    max_beams: 720
    max_particles: 5000
    min_particles: 1000
    odom_frame_id: "robot2/odom"
    pf_err: 0.01
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.2
    update_min_d: 0.05
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.05
    z_short: 0.0
    scan_topic: front/scan_fixed
    set_initial_pose: true
    initial_pose:
      x: -0.3
      y: -7.06
      z: 0.0
      yaw: 0.0

robot2/bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: robot2/map
    robot_base_frame: robot2/base_link
    odom_topic: robot2/odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 60
    action_server_result_timeout: 900.0
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    transform_tolerance: 0.5

robot2/controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.2

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.8
      # Lookahead — use_velocity_scaled=true donc lookahead_dist = vel × lookahead_time
      # 1.2 × 0.4 = 0.48 m → dans les virages, lookahead court
      lookahead_dist: 0.8                # fallback si scaled=false
      min_lookahead_dist: 0.3            # était 0.64 → trop grand, bloque la réduction
      max_lookahead_dist: 1.0            # était 1.2 → limiter le saut après virage
      lookahead_time: 0.4              # était 1.0 → 1.2 × 0.4 = 0.48 m ✓
      # Anticipation courbure AVANT le virage
      use_fixed_curvature_lookahead: true   # était false → détecte le virage en avance
      curvature_lookahead_dist: 0.5         # regarde 0.5 m devant avant d'entrer
      # Régulation vitesse en courbe
      use_regulated_linear_velocity_scaling: true
      curvature_feedback_gain: 15.0         # était 6.0 → freine agressivement
      regulated_linear_scaling_min_radius: 0.3  # était 0.4 → déclenche plus tôt
      regulated_linear_scaling_min_speed: 0.2   # était 0.25
      # Approche goal
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.8   # ok
      # Collision
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.4  # ok
      # Rotation
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      rotate_to_heading_angular_vel: 2.5
      max_angular_accel: 7.0
      min_vel_theta: 0.8
      max_vel_theta: 3.5
      # Autres
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.5              # était 1.0 → trop permissif
      allow_reversing: false
      max_robot_pose_search_dist: 10.0  

robot2/local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: robot2/odom
      robot_base_frame: robot2/base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      transform_tolerance: 1.0
      footprint: "[[0.29, 0.215], [0.29, -0.215], [-0.29, -0.215], [-0.29, 0.215]]"
      footprint_padding: 0.01
      plugins: ["voxel_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3
        cost_scaling_factor: 8.0

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /robot2/front/scan_fixed
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.10

      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        always_send_full_costmap: true

robot2/global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: robot2/map
      robot_base_frame: robot2/base_link
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 1.0
      footprint: "[[0.29, 0.215], [0.29, -0.215], [-0.29, -0.215], [-0.29, 0.215]]"
      footprint_padding: 0.00
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /robot2/front/scan_fixed
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.10
        

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0
        always_send_full_costmap: true

robot2/map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

robot2/map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

robot2/planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: true
    transform_tolerance: 0.5
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: true
      allow_unknown: false

robot2/smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

robot2/behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: robot2/odom
    robot_base_frame: robot2/base_link
    transform_tolerance: 0.3
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 2.5
    min_rotational_vel: 0.8
    rotational_acc_lim: 5.0

robot2/waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

robot2/velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.2, 0.0, 3.0]
    min_velocity: [-0.5, 0.0, -3.0]
    max_accel: [1.2, 0.0, 7.0]
    max_decel: [-2.5, 0.0, -7.0]
    odom_topic: /robot2/odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

robot2/collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "robot2/base_link"
    odom_frame_id: "robot2/odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "robot2/cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop"]
    PolygonStop:
      type: "circle"
      radius: 0.1
      action_type: "stop"
      min_points: 6
      visualize: true
      polygon_pub_topic: "polygon_stop"
    observation_sources: ["scan"]      # ← MANQUAIT
    scan:
      type: "scan"
      topic: "/robot2/front/scan_fixed"
   